services:
  database:
    image: 'postgres:latest'
    ports:
      - 5432:5432
    env_file:
      - ./env/.env.dev
    volumes:
      - ${PWD}/pgdb-data/:/var/lib/postgresql/
  
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 15433:80
    env_file:
      - ./env/.env.dev
    depends_on:
      - database
    # networks:
    #   - postgres-network
    volumes:
      - ${PWD}/pgadmin-data/:/var/lib/pgadmin/

